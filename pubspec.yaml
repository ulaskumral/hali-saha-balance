name: hali_saha_balance
description: Offline-first halı saha kadro ve akıllı takım dengeleme uygulaması.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  archive: ^4.3.0
  share_plus: ^13.3.0
  uuid: ^4.6.0
  image_picker: ^1.2.3
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.32.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
